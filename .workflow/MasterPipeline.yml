version: '1.0'
name: master-pipeline
displayName: RikkaHub 头像版构建
triggers:
  trigger: auto
  push:
    branches:
      include:
        - master
stages:
  - name: build
    displayName: 安装环境并编译 APK
    strategy: naturally
    trigger: auto
    steps:
      - step: build@gcc
        name: build_apk
        displayName: 构建
        gccVersion: 9.4
        commands:
          - chmod +x ./build_ci.sh
          - bash ./build_ci.sh
        artifacts:
          - name: APK_OUTPUT
            path:
              - ./app/build/outputs/apk/github/
      - step: publish@general_artifacts
        name: publish_apk
        displayName: 上传 APK
        dependArtifact: APK_OUTPUT
        artifactName: rikkahub-avatar
        dependsOn: build_apk
