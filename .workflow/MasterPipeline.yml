version: '1.0'
name: master-pipeline
displayName: RikkaHub 头像版构建
triggers:
  trigger: auto
  push:
    branches:
      include:
        - master
stages:
  - name: build
    displayName: 安装环境并编译 APK
    strategy: naturally
    trigger: auto
    steps:
      - step: build@android
        name: build_apk
        displayName: 构建
        jdkVersion: '21'
        gradleVersion: '9.0'
        buildToolsVersion: '35.0.1'
        ndkVersion: '28.2.13676358'
        commands:
          - chmod +x ./build_ci.sh
          - bash ./build_ci.sh
        artifacts:
          - name: APK_OUTPUT
            path:
              - ./app/build/outputs/apk/github/
        caches:
          - ~/.gradle
      - step: publish@general_artifacts
        name: publish_apk
        displayName: 上传 APK
        dependArtifact: APK_OUTPUT
        artifactName: rikkahub-avatar
        artifactRepository: default
        dependsOn: build_apk
